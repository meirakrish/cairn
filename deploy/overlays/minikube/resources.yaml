apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  template:
    spec:
      containers:
        - name: garage
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
