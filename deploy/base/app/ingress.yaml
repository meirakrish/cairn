# One host: web serves the SPA and proxies /api to the api. TLS and host come from the overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cairn
  annotations:
    # ingress-nginx: long-lived SSE streams and uploads.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
spec:
  rules:
    - host: cairn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { name: http }
