# Applies migrations as postgres. Re-run after each deploy that adds one:
# kubectl -n cairn delete job migrate && kubectl apply -k <overlay>
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cairn-migrate
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: cairn-secrets
                  key: DATABASE_ADMIN_URL
